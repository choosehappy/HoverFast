[tool.ruff]
target-version = "py39"
line-length = 120
src = ["hoverfast"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",   # line length handled by ruff format
    "F403",   # star imports (used in augment.py, training_utils.py)
    "F405",   # may be undefined from star imports
    "N802",   # function name should be lowercase (HED/minutes naming convention)
    "N803",   # argument name should be lowercase
    "N806",   # argument name should be lowercase
    "N812",   # lowercase functional imported as F (PyTorch convention)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
disable_error_code = ["type-arg"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers -v"
